services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-P@ssw0rd123!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # sqlcmd lives at this path in the mssql-tools18 package bundled
      # with the 2022 image; -C trusts the server's self-signed cert.
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Seq is a log server with a searchable UI, built specifically for
  # structured events like Serilog's - port 80 handles both the web UI
  # and the ingestion API Serilog's Seq sink posts to.
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  # Exceptionless: self-hosted exception tracking (needs Elasticsearch + Redis, unlike Seq's single container).
  exceptionless-elasticsearch:
    image: exceptionless/elasticsearch:8.19.21
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - exceptionless-esdata:/usr/share/elasticsearch/data

  exceptionless-redis:
    image: redis:7.4-alpine

  exceptionless:
    image: exceptionless/app:latest
    depends_on:
      - exceptionless-elasticsearch
      - exceptionless-redis
    environment:
      EX_AppMode: Production
      EX_ConnectionStrings__Cache: provider=redis
      EX_ConnectionStrings__Elasticsearch: server=http://exceptionless-elasticsearch:9200
      EX_ConnectionStrings__MessageBus: provider=redis
      EX_ConnectionStrings__Queue: provider=redis
      EX_ConnectionStrings__Redis: exceptionless-redis,abortConnect=false
      EX_ConnectionStrings__Storage: provider=folder;path=/app/storage
      EX_RunJobsInProcess: "false"
    ports:
      - "7110:8080"
    volumes:
      - exceptionless-appdata:/app/storage

  exceptionless-jobs:
    image: exceptionless/job:latest
    depends_on:
      - exceptionless
    environment:
      EX_AppMode: Production
      EX_BaseURL: http://localhost:7110
      EX_ConnectionStrings__Cache: provider=redis
      EX_ConnectionStrings__Elasticsearch: server=http://exceptionless-elasticsearch:9200
      EX_ConnectionStrings__MessageBus: provider=redis
      EX_ConnectionStrings__Queue: provider=redis
      EX_ConnectionStrings__Redis: exceptionless-redis,abortConnect=false
      EX_ConnectionStrings__Storage: provider=folder;path=/app/storage
    volumes:
      - exceptionless-appdata:/app/storage

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    depends_on:
      sqlserver:
        condition: service_healthy

  backend:
    build:
      context: ./WetSeasonBackend/WetSeasonBackend
      target: build # <--- Tells Docker to stop at Stage 1 (keeps the SDK)

    # Override the default startup command to use the live-reloader
    command: dotnet watch run --no-launch-profile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Double-underscore is ASP.NET Core's convention for env vars that
      # override nested appsettings.json keys - this sets
      # ConnectionStrings:Default, same as Laravel's DB_* .env vars
      # overriding config/database.php.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=WetSeasonDb;User Id=sa;Password=${DB_PASSWORD:-P@ssw0rd123!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-O30F07pjBXTLfwcMVOj2V00F28+vfYoA1A5WWCazmKY=}"
      Jwt__Issuer: "WetSeasonApi"
      Cors__AllowedOrigins: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
      # Overrides just the Seq sink's URL from appsettings.json's WriteTo[1] -
      # "seq" is Docker's internal DNS name for the seq service, unreachable
      # as "localhost" from inside this container. Index-based, so this
      # silently targets the wrong sink if WriteTo's order ever changes.
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
      Exceptionless__ApiKey: "pvQEJwQXLhFRPWnYfAfHdJ7ifI0fBxI8cWcfZN7A"
      Exceptionless__ServerUrl: "http://exceptionless:8080"
      # No "http://" here - unlike Seq/Exceptionless above, the Temporal SDK
      # treats this as a bare gRPC host:port, not a URL. Adding a scheme makes
      # it throw "TargetHost cannot have ://" and crash the whole app on
      # startup, since a failed background service (the Temporal worker)
      # stops the whole host by default.
      Temporal__Address: "temporal:7233"
    ports:
      - "5118:8080"
    develop:
      watch:
        # Sync all C# files from your laptop into the container's /src folder
        - action: sync
          path: ./WetSeasonBackend/WetSeasonBackend
          target: /src
    depends_on:
      sqlserver:
        condition: service_healthy
      # No healthcheck defined on the temporal service, so this can only wait
      # for the container to start, not for the dev server inside it to be
      # ready to accept connections - the Temporal client itself retries on
      # connect, so a few seconds' lag here isn't fatal, just worth knowing.
      temporal:
        condition: service_started

  frontend:
    build:
      context: ./wetseason-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./wetseason-frontend/src # What folder to watch on your laptop
          target: /app/src

volumes:
  sqlserver-data:
  seq-data:
  exceptionless-esdata:
  exceptionless-appdata:
